name: PHP style

on: [push, pull_request]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
